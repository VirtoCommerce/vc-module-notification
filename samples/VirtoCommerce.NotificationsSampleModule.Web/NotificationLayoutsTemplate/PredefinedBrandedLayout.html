<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        body { margin: 0; padding: 0; background-color: #f4f4f7; font-family: Arial, sans-serif; }
        .wrapper { width: 100%; background-color: #f4f4f7; padding: 20px 0; }
        .header { background-color: #1a73e8; color: #ffffff; text-align: center; padding: 20px; }
        .header h1 { margin: 0; font-size: 22px; }
        .header p { margin: 4px 0 0; font-size: 12px; opacity: 0.8; }
        .content { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; }
        .footer { text-align: center; padding: 20px; font-size: 12px; color: #999999; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1>Sample Store</h1>
        <p>Predefined Layout v1 &mdash; update this in code and restart to see changes</p>
    </div>
    <div class="content">
        {{ content }}
    </div>
    <div class="footer">
        &copy; 2026 Sample Store. This is a predefined layout from VirtoCommerce.NotificationsSampleModule.
    </div>
</div>
</body>
</html>
